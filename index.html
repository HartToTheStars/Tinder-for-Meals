<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut" />
<title>forks. | meet your next meal.</title>
<meta name="description" content="Meet your next meal. Swipe through recipes from your favorite food sites and keep the ones you love." />
<meta name="theme-color" content="#f7f1e8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8553e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2'/%3E%3Cpath d='M7 2v20'/%3E%3Cpath d='M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20" />
</head>
<body class="home">
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 class="logo"><button id="logoBtn" aria-label="forks, back to swiping">forks<span>.</span></button></h1>
      <p class="tagline">meet your next meal.</p>
    </div>
    <div class="top-right">
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-view="swipe" role="tab" aria-selected="true">Swipe</button>
        <button class="tab" data-view="kept" role="tab" aria-selected="false">Kept <span class="count" id="keptCount" hidden>0</span></button>
      </nav>
      <button class="acct-btn" id="acctBtn" aria-label="Account"><span id="acctIcon"></span><i class="acct-dot" id="acctDot" hidden></i></button>
    </div>
  </header>

  <main>
    <!-- SWIPE -->
    <section class="view view-swipe is-active" id="view-swipe">
      <div class="ambient" id="ambient" aria-hidden="true"></div>
      <div class="stage">
        <div class="cats" id="cats" role="radiogroup" aria-label="Filter by course"></div>
        <div class="tags" id="tags" role="group" aria-label="Dietary and lifestyle filters"></div>
        <div class="deck" id="deck" aria-live="polite">
          <div class="deck-msg" id="deckMsg">
            <div class="spinner"></div>
            <p>Setting the table…</p>
          </div>
        </div>
        <div class="actions">
          <button class="act act-undo" id="btnUndo" aria-label="Undo" title="Undo (⌫)" data-key="⌫" disabled></button>
          <button class="act act-nope" id="btnNope" aria-label="Pass" title="Pass (←)" data-key="←"></button>
          <button class="act act-like" id="btnLike" aria-label="Keep" title="Keep (→)" data-key="→"></button>
          <a class="act act-open" id="btnOpen" aria-label="Open recipe" title="Open recipe (↑)" data-key="↑" target="_blank" rel="noopener"></a>
        </div>
        <p class="hint">Drag, or use ← → keys</p>
      </div>
    </section>

    <!-- KEPT -->
    <section class="view view-kept" id="view-kept">
      <div class="side-head"><h2>Your keeps</h2><span class="count" id="keptCount2" hidden>0</span></div>
      <div class="cats" id="keptCats" role="radiogroup" aria-label="Filter keepers by course"></div>
      <div class="tags" id="keptTags" role="group" aria-label="Filter keepers by diet and lifestyle"></div>
      <div class="search">
        <span id="searchIcon"></span>
        <input id="search" type="search" placeholder="Search your keepers…" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="keptEmpty" hidden>
        <div class="empty-ic" id="emptyIcon"></div>
        <p>Nothing kept yet. Go swipe right on something delicious.</p>
        <button class="btn empty-go" id="emptyGo">Start swiping</button>
      </div>
    </section>
  </main>

  <footer class="foot">Made with <span id="footHeart"></span> for Kelly <span class="dot-sep">·</span> <a href="privacy.html">Privacy</a></footer>
</div>

<!-- 20-swipe check-in -->
<div class="break" id="break" hidden>
  <div class="break-sheet" role="dialog" aria-modal="true" aria-labelledby="breakTitle">
    <div class="break-icon" id="breakIcon"></div>
    <h3 id="breakTitle"></h3>
    <p id="breakText"></p>
    <div class="break-thumbs" id="breakThumbs"></div>
    <button class="btn break-go" id="breakGo">Keep swiping</button>
    <button class="break-stop" id="breakStop">I'm done for today</button>
  </div>
</div>

<!-- Save your keeps / sign in -->
<div class="break" id="save" hidden>
  <form class="break-sheet" id="saveForm" role="dialog" aria-modal="true" aria-labelledby="saveTitle" novalidate>
    <div class="break-icon" id="saveIcon"></div>
    <h3 id="saveTitle"></h3>
    <p id="saveText"></p>
    <div class="save-thumbs break-thumbs" id="saveThumbs"></div>
    <label class="save-field" id="saveField">
      <span class="sr">Email</span>
      <input id="saveEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" />
    </label>
    <p class="save-err" id="saveErr" role="alert" hidden></p>
    <button class="btn break-go" id="saveGo" type="submit"></button>
    <button class="break-stop" id="saveSkip" type="button"></button>
    <p class="fine" id="saveFine">We'll never sell your data. <a href="privacy.html" target="_blank" rel="noopener">Privacy</a></p>
  </form>
</div>

<!-- Signed-in account -->
<div class="break" id="acct" hidden>
  <div class="break-sheet" role="dialog" aria-modal="true" aria-labelledby="acctTitle">
    <div class="break-icon" id="acctSheetIcon"></div>
    <h3 id="acctTitle">You're signed in</h3>
    <p id="acctText"></p>
    <button class="btn break-go" id="acctDone">Done</button>
    <button class="break-stop" id="acctOut">Sign out</button>
    <button class="fine danger" id="acctDelete" type="button">Delete my account</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="app.js?v=20"></script>
</body>
</html>
